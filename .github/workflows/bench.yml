name: Weekly benchmark
on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: benchmark-prod
  cancel-in-progress: false
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prod
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run bench
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-${{ github.run_id }}
          path: results/
          if-no-files-found: warn
      - name: Commit generated results
        run: |
          test "$(git branch --show-current)" = prod
          node --input-type=module -e "import fs from 'node:fs'; const r = JSON.parse(fs.readFileSync('results/latest.json')); if (r.status !== 'complete' || r.mode !== 'full') process.exit(1);"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- results/ README.md
          if git diff --cached --quiet; then
            echo 'No generated changes'
            exit 0
          fi
          test "$(git branch --show-current)" = prod
          git commit -m 'chore: update benchmark results'
          git pull --rebase origin prod
          test "$(git branch --show-current)" = prod
          git push origin HEAD:prod
